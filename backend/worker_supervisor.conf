[program:bg_worker_1]
command=/root/.venv/bin/python /app/backend/start_bg_workers.py
directory=/app/backend
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/bg_worker_1.err.log
stdout_logfile=/var/log/supervisor/bg_worker_1.out.log
user=root
environment=PATH="/root/.venv/bin:%(ENV_PATH)s"

[program:bg_worker_2]
command=/root/.venv/bin/python /app/backend/start_bg_workers.py
directory=/app/backend
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/bg_worker_2.err.log
stdout_logfile=/var/log/supervisor/bg_worker_2.out.log
user=root
environment=PATH="/root/.venv/bin:%(ENV_PATH)s"

[group:bg_workers]
programs=bg_worker_1,bg_worker_2
priority=999